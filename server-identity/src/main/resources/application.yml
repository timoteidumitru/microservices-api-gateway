server:
  port: 7575                                     # Gateway service will run on this port

spring:
  application:
    name: IDENTITY-SERVICE                       # Gateway service name in Eureka
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: jdbc:mysql://localhost:3306/users_db
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/  # Eureka server URL
    register-with-eureka: true                    # Gateway registers with Eureka
    fetch-registry: true                          # Gateway fetches the service registry

